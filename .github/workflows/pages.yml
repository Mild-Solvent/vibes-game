# Publishes the Mushroom Foraging website to GitHub Pages.
# The site lives in SITE_DIR; if it moves, change it here and in the paths filter below.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "godot/Mushroom/DOCS/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_DIR: godot/Mushroom/DOCS/site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
